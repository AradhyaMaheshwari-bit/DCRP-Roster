# =====================================================================
# DCRP-Roster — Discord role mapping
# =====================================================================
# Maps (Department, Rank) → list of Discord role IDs that should be held
# by a member of that rank in that department.
#
# When a member's role_request is approved, the bot:
#   1. Adds every role_id in the matching (Department, Rank) list.
#   2. Removes every rank role from any other (Department, Rank) entry
#      that the member currently holds (reconcile).
#   3. Adds the department-level role (see `department_roles`).
#
# The coordinator fills in real Discord role IDs in a follow-up commit.
# Every entry is scaffolded with `role_ids: []` so the schema is known
# even before IDs are filled in.
#
# The bot refuses to complete an approval that targets an entry whose
# `role_ids` is empty (raises RoleConfigMissingError).
# =====================================================================

# Department-level roles (one per department; given in addition to rank roles)
department_roles:
  SASP:  []
  LSPD:  []
  BCSO:  []
  SASPR: []
  SAHP:  []
  DOC:   []
  SWAT:  []
  CID:   []
  PSC:   []
  DOJ:   []

